<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crazybrain</title>
  <style>
    :root { color-scheme: light dark; --fond: #f7f7f5; --carte: #ffffff; --texte: #1d1d1b; --doux: #6b6b66;
            --bord: #deded8; --accent: #2f5fd0; --erreur: #b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --fond: #161615; --carte: #22221f; --texte: #ecece8; --doux: #9a9a94;
              --bord: #3a3a36; --accent: #8fb0ff; --erreur: #ffb4ab; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fond); color: var(--texte);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.4; }
    main { max-width: 40rem; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.6rem; margin: 8px 0 16px; }
    form { margin-bottom: 16px; }
    label { display: block; font-size: .9rem; color: var(--doux); margin-bottom: 6px; }
    input { width: 100%; font: inherit; font-size: 1.05rem; padding: 12px 14px; border-radius: 10px;
            border: 1px solid var(--bord); background: var(--carte); color: var(--texte); }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { background: var(--carte); border: 1px solid var(--bord); border-radius: 10px; padding: 8px 10px;
         margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
    li input[type=checkbox] { width: 22px; height: 22px; flex: none; margin: 0; accent-color: var(--accent); }
    li .titre { flex: 1; min-width: 0; text-align: left; font: inherit; color: inherit; background: none; border: 0;
                padding: 6px 0; overflow-wrap: anywhere; cursor: text; }
    li input.edition { flex: 1; min-width: 0; padding: 6px 8px; font-size: 1rem; }
    li input[type=date] { width: 8.6rem; flex: none; font-size: .8rem; padding: 4px 6px; color: var(--doux); }
    /* Sans échéance, le champ se réduit à son icône de calendrier : la place va au titre. */
    li input[type=date].vide { width: 40px; color: transparent; border-color: transparent; background: none; }
    li input[type=date].en-retard { color: var(--erreur); border-color: var(--erreur); }
    li .supprimer { flex: none; width: 36px; height: 36px; border: 0; border-radius: 8px; background: none;
                    color: var(--doux); font-size: 1.3rem; line-height: 1; cursor: pointer; }
    li .supprimer:hover, li .supprimer:focus-visible { background: var(--fond); color: var(--erreur); }
    .etat button { font: inherit; color: var(--accent); background: none; border: 0; padding: 4px 8px;
                   margin-left: 4px; cursor: pointer; text-decoration: underline; }
    li.fait { opacity: .6; }
    li.fait .titre { text-decoration: line-through; }
    .etat { color: var(--doux); margin: 8px 0; }
    .erreur { color: var(--erreur); }
  </style>
</head>
<body>
  <main>
    <h1>Crazybrain</h1>
    <form id="saisie" autocomplete="off">
      <label for="titre">Nouvelle tâche (Entrée pour l'ajouter)</label>
      <input id="titre" name="titre" maxlength="200" enterkeyhint="done" placeholder="Taper une tâche…" autofocus>
    </form>
    <p id="message" class="etat" role="status" aria-live="polite">Chargement…</p>
    <ul id="liste"></ul>
  </main>
  <script>
    // Pas de cadriciel (décision 002) : quelques lignes de JavaScript qui appellent l'API.
    const liste = document.getElementById('liste');
    const message = document.getElementById('message');
    const champ = document.getElementById('titre');

    function afficherMessage(texte, erreur = false) {
      message.textContent = texte;
      message.className = erreur ? 'etat erreur' : 'etat';
      message.hidden = texte === '';
    }

    // Appelle l'API. Si la connexion Access a expiré, la réponse n'est pas du JSON (page de connexion,
    // ou redirection que le navigateur bloque) : on le dit au lieu de rester vide.
    async function appeler(chemin, options) {
      let reponse;
      try {
        reponse = await fetch(chemin, options);
      } catch {
        throw new Error('Connexion perdue ou expirée : recharger la page.');
      }
      const type = reponse.headers.get('content-type') || '';
      if (!type.includes('application/json')) {
        throw new Error('Connexion expirée : recharger la page.');
      }
      const corps = await reponse.json();
      if (!reponse.ok) throw new Error(corps.erreur || 'Erreur ' + reponse.status);
      return corps;
    }

    // Envoie une modification (seuls les champs donnés changent), puis recharge la liste.
    async function modifier(id, changements) {
      try {
        await appeler('/api/elements/' + encodeURIComponent(id), {
          method: 'PATCH',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(changements),
        });
      } catch (e) {
        afficherMessage(e.message, true);
        return;
      }
      await charger();
    }

    // Le jour d'aujourd'hui sur le téléphone, au format AAAA-MM-JJ (celui des échéances).
    function aujourdhui() {
      const d = new Date();
      return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
    }

    // Toucher le titre le remplace par un champ : Entrée ou quitter le champ enregistre, Échap annule.
    function editerTitre(element, bouton) {
      const champTitre = document.createElement('input');
      champTitre.className = 'edition';
      champTitre.value = element.titre;
      champTitre.maxLength = 200;
      champTitre.setAttribute('aria-label', 'Titre de la tâche');
      let fini = false;
      const terminer = async (enregistrer) => {
        if (fini) return;
        fini = true;
        const titre = champTitre.value.trim();
        if (enregistrer && titre !== '' && titre !== element.titre) {
          await modifier(element.id, { titre });
        } else {
          champTitre.replaceWith(bouton);
        }
      };
      champTitre.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); terminer(true); }
        if (e.key === 'Escape') { e.preventDefault(); terminer(false); }
      });
      champTitre.addEventListener('blur', () => terminer(true));
      bouton.replaceWith(champTitre);
      champTitre.focus();
    }

    function ligneDe(element) {
      const fait = element.statut === 'fait';
      const ligne = document.createElement('li');
      ligne.dataset.id = element.id;
      if (fait) ligne.classList.add('fait');

      const coche = document.createElement('input');
      coche.type = 'checkbox';
      coche.checked = fait;
      coche.setAttribute('aria-label', fait ? 'Marquer à faire' : 'Marquer comme faite');
      coche.addEventListener('change', () => modifier(element.id, { statut: coche.checked ? 'fait' : 'a_faire' }));

      const titre = document.createElement('button');
      titre.type = 'button';
      titre.className = 'titre';
      titre.textContent = element.titre; // textContent : le titre n'est jamais interprété comme du HTML
      titre.addEventListener('click', () => editerTitre(element, titre));

      const echeance = document.createElement('input');
      echeance.type = 'date';
      echeance.value = element.echeance || '';
      if (!element.echeance) echeance.classList.add('vide');
      echeance.setAttribute('aria-label', 'Échéance');
      if (!fait && element.echeance && element.echeance < aujourdhui()) {
        echeance.classList.add('en-retard');
        echeance.title = 'Échéance dépassée';
      }
      echeance.addEventListener('change', () => modifier(element.id, { echeance: echeance.value || null }));

      const supprimer = document.createElement('button');
      supprimer.type = 'button';
      supprimer.className = 'supprimer';
      supprimer.textContent = '×';
      supprimer.setAttribute('aria-label', 'Supprimer « ' + element.titre + ' »');
      supprimer.addEventListener('click', () => supprimerTache(element));

      ligne.append(coche, titre, echeance, supprimer);
      return ligne;
    }

    // Supprimer ne demande pas de confirmation : la tâche est archivée, et un bouton « Annuler »
    // la restaure tout de suite (plus rapide qu'une question à chaque fois, et rien n'est perdu).
    async function supprimerTache(element) {
      try {
        const reponse = await fetch('/api/elements/' + encodeURIComponent(element.id), { method: 'DELETE' });
        if (reponse.status !== 204) throw new Error('Suppression impossible (erreur ' + reponse.status + ').');
      } catch (e) {
        afficherMessage(e.message, true);
        return;
      }
      await charger();
      message.replaceChildren('« ' + element.titre + ' » supprimée.');
      const annuler = document.createElement('button');
      annuler.type = 'button';
      annuler.textContent = 'Annuler';
      annuler.addEventListener('click', async () => {
        try {
          await appeler('/api/elements/' + encodeURIComponent(element.id) + '/restaurer', { method: 'POST' });
        } catch (e) {
          afficherMessage(e.message, true);
          return;
        }
        await charger();
      });
      message.append(annuler);
      message.className = 'etat';
      message.hidden = false;
    }

    // Les tâches à faire d'abord (les plus récentes en haut), les faites ensuite.
    function afficher(elements) {
      const aFaire = elements.filter((e) => e.statut !== 'fait');
      const faites = elements.filter((e) => e.statut === 'fait')
        .sort((a, b) => (b.faitLe || '').localeCompare(a.faitLe || ''));
      liste.replaceChildren(...aFaire.concat(faites).map(ligneDe));
      afficherMessage(elements.length === 0 ? 'Aucune tâche pour l’instant.' : '');
    }

    async function charger() {
      try {
        afficher((await appeler('/api/elements')).elements);
      } catch (e) {
        afficherMessage(e.message, true);
      }
    }

    document.getElementById('saisie').addEventListener('submit', async (evenement) => {
      evenement.preventDefault();
      const titre = champ.value;
      if (titre.trim() === '') return;
      champ.disabled = true;
      try {
        await appeler('/api/elements', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ titre }),
        });
        champ.value = '';
        await charger();
      } catch (e) {
        afficherMessage(e.message, true);
      } finally {
        champ.disabled = false;
        champ.focus();
      }
    });

    charger();
  </script>
</body>
</html>
