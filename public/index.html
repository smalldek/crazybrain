<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crazybrain</title>
  <style>
    :root { color-scheme: light dark; --fond: #f7f7f5; --texte: #1d1d1b; --doux: #6b6b66; }
    @media (prefers-color-scheme: dark) { :root { --fond: #161615; --texte: #ecece8; --doux: #9a9a94; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           box-sizing: border-box; background: var(--fond); color: var(--texte);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 32rem; text-align: center; }
    h1 { font-size: 2.2rem; margin: 0 0 .5rem; }
    p { color: var(--doux); line-height: 1.5; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Crazybrain</h1>
    <p>Gestion des tâches et des projets. En construction : cette page d'accueil est la première pierre.</p>
  </main>
</body>
</html>
