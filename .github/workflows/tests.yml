# Lance tous les tests à chaque PR. Le déploiement (deployer.yml) l'appelle aussi et ne part que s'il passe.
name: Tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Types (le compilateur, en mode strict)
        run: npm run verifier-types
      - name: Tests unitaires (domaine)
        run: npm test
      - name: Navigateur des tests de la page (Chromium, pour Playwright)
        run: npx playwright install --with-deps chromium
      - name: Tests d'acceptation (scénarios Gherkin : API, connecteur, et la page dans un vrai navigateur)
        run: npm run test:acceptation
      - name: Tests du garde-fou Access (l'ouverture du connecteur, et rien d'autre)
        run: python3 -m unittest discover -s tests/outils -v
