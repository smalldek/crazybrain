# Met le site en ligne sur Cloudflare à chaque fusion dans main (ou à la main, onglet Actions).
# Sans les deux secrets Cloudflare du dépôt, ne fait rien et le dit.
name: Déployer sur Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deployer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Déploiement configuré ?
        id: config
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=oui" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents : rien n'est déployé."
            echo "ok=non" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ok == 'oui'

      - name: Déployer
        if: steps.config.outputs.ok == 'oui'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
