# Met le site en ligne sur Cloudflare à chaque fusion dans main (ou à la main, onglet Actions).
# Ne déploie jamais sans Cloudflare Access (la connexion Google) devant l'adresse.
# Sans les deux secrets Cloudflare du dépôt, ne fait rien et le dit.
# Ne déploie que si tous les tests passent (tests.yml).
name: Déployer sur Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deployer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deployer:
    needs: tests
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HOTE: crazybrain.dekermadec.net
      ZONE: dekermadec.net
      # La règle « qui a le droit d'entrer » est recopiée de celle du site du vault.
      HOTE_MODELE: vault.dekermadec.net
    steps:
      - name: Déploiement configuré ?
        id: config
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=oui" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID absents : rien n'est déployé."
            echo "ok=non" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ok == 'oui'

      # Access et le pare-feu de la zone sont décrits et posés ailleurs (dépôt privé smalldek/cluster,
      # dossier cloudflare/, OpenTofu) : ce déploiement ne les modifie pas, il vérifie seulement.
      # Décision 003 : seules les adresses du connecteur Claude passent sans Access ; le garde-fou
      # refuse toute autre ouverture.
      - name: Cloudflare Access protège-t-il l'adresse ?
        if: steps.config.outputs.ok == 'oui'
        run: python3 outils/verifier_access.py avant

      - uses: actions/setup-node@v4
        if: steps.config.outputs.ok == 'oui'
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        if: steps.config.outputs.ok == 'oui'
        run: npm ci

      # La base D1 « crazybrain » : créée si elle manque. Son identifiant est écrit dans la copie de
      # wrangler.jsonc de cette machine seulement (jamais commité), et masqué dans le journal.
      - name: Base D1 (créer si elle manque, appliquer les migrations)
        if: steps.config.outputs.ok == 'oui'
        run: |
          set -o pipefail
          id_base() { npx wrangler d1 list --json | python3 -c 'import json,sys; print(next((b["uuid"] for b in json.load(sys.stdin) if b["name"] == "crazybrain"), ""))'; }
          ID=$(id_base)
          if [ -z "$ID" ]; then
            echo "Base crazybrain absente : création."
            npx wrangler d1 create crazybrain > /dev/null
            ID=$(id_base)
          fi
          if [ -z "$ID" ]; then echo "::error::Base crazybrain introuvable après création."; exit 1; fi
          echo "::add-mask::$ID"
          sed -i "s/\"REMPLACE_AU_DEPLOIEMENT\"/\"$ID\"/" wrangler.jsonc
          npx wrangler d1 migrations apply crazybrain --remote

      # L'espace KV des jetons OAuth du connecteur (rangés hachés) : créé s'il manque, identifiant
      # masqué et écrit dans la copie locale de wrangler.jsonc seulement.
      - name: Espace KV du connecteur (créer s'il manque)
        if: steps.config.outputs.ok == 'oui'
        run: |
          set -o pipefail
          id_kv() { npx wrangler kv namespace list | python3 -c 'import json,sys; print(next((n["id"] for n in json.load(sys.stdin) if n["title"] == "crazybrain-oauth"), ""))'; }
          ID=$(id_kv)
          if [ -z "$ID" ]; then
            echo "Espace KV crazybrain-oauth absent : création."
            npx wrangler kv namespace create crazybrain-oauth > /dev/null
            ID=$(id_kv)
          fi
          if [ -z "$ID" ]; then echo "::error::Espace KV crazybrain-oauth introuvable après création."; exit 1; fi
          echo "::add-mask::$ID"
          sed -i "s/\"REMPLACE_AU_DEPLOIEMENT_KV\"/\"$ID\"/" wrangler.jsonc

      # L'AUD de l'application Access : le Worker l'exige dans chaque jeton (deuxième serrure).
      # Lue à chaque déploiement, masquée dans le journal, jamais écrite dans le dépôt.
      - name: Déployer (construire l'interface, puis envoyer le Worker et dist/)
        if: steps.config.outputs.ok == 'oui'
        run: |
          AUD=$(python3 outils/verifier_access.py aud)
          echo "::add-mask::$AUD"
          npm run construire
          npx wrangler deploy --var "AUD:$AUD"

      # Les clés VAPID des rappels (tâche 5.5) : tirées une seule fois, la première fois que le Worker
      # n'a pas ces secrets, et rangées comme secrets du Worker (jamais affichées, jamais dans le
      # dépôt). Les déploiements suivants les gardent : les téléphones abonnés restent abonnés.
      - name: Clés des rappels (créer si elles manquent)
        if: steps.config.outputs.ok == 'oui'
        run: |
          set -o pipefail
          if npx wrangler secret list --format json | python3 -c 'import json,sys; sys.exit(0 if any(s["name"] == "VAPID_PRIVEE" for s in json.load(sys.stdin)) else 1)'; then
            echo "Clés des rappels déjà en place."
          else
            echo "Clés des rappels absentes : création."
            FICHIER="$RUNNER_TEMP/vapid.json"
            npx tsx outils/cles-vapid.ts "$FICHIER"
            npx wrangler secret bulk "$FICHIER" > /dev/null
            rm -f "$FICHIER"
          fi

      - name: Sans connexion, l'adresse refuse-t-elle ?
        if: steps.config.outputs.ok == 'oui'
        run: python3 outils/verifier_access.py apres
